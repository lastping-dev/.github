name: Feature request
description: Suggest a change or a new capability for this repository.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you monitoring, what did you try, and where did it fall short?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: How you would expect it to work. An example config or command helps.
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you have tried
